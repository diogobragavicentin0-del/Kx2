<!-- Importando o Firebase Realtime Database -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Substitua com as chaves do seu projeto Firebase Console
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, 'mensagens');

  // Elementos da tela
  const inputMsg = document.querySelector('input'); // Campo de texto
  const btnEnviar = document.querySelector('button'); // Botão Enviar
  const areaMensagens = document.querySelector('.chat-box'); // Conteúdo do chat

  // Enviar mensagem para a nuvem
  function enviar() {
    if (!inputMsg.value.trim()) return;
    push(messagesRef, {
      usuario: "diogo",
      texto: inputMsg.value,
      horario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    inputMsg.value = '';
  }

  btnEnviar.addEventListener('click', enviar);

  // Receber mensagens em tempo real (no PC e no Celular)
  onChildAdded(messagesRef, (snapshot) => {
    const data = snapshot.val();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'mensagem';
    msgDiv.innerHTML = `<strong>${data.usuario}:</strong> ${data.texto} <small>${data.horario}</small>`;
    areaMensagens.appendChild(msgDiv);
  });
</script>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConectaKx2 - Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #0084ff;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mensagem {
      background-color: #e4e6eb;
      padding: 10px 14px;
      border-radius: 18px;
      max-width: 80%;
      width: fit-content;
      word-wrap: break-word;
    }

    .mensagem.minha {
      align-self: flex-end;
      background-color: #0084ff;
      color: white;
    }

    .chat-footer {
      padding: 10px;
      display: flex;
      gap: 8px;
      border-top: 1fr solid #eee;
      background: #fff;
    }

    .chat-footer input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .chat-footer button {
      background-color: #0084ff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .chat-footer button:hover {
      background-color: #006bce;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <span>💬 ConectaKx2</span>
      <small style="opacity: 0.8;">Online</small>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="mensagem">
        <strong>Sistema:</strong> Bem-vindo ao chat!
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="messageInput" placeholder="Digite uma mensagem..." onkeypress="checarEnter(event)">
      <button onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');

    function enviarMensagem() {
      const texto = messageInput.value.trim();
      if (texto === "") return;

      // Cria a bolha da mensagem enviada
      const msgDiv = document.createElement('div');
      msgDiv.className = 'mensagem minha';
      msgDiv.innerHTML = texto;

      chatBox.appendChild(msgDiv);
      messageInput.value = '';

      // Rola para o fim da tela
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function checarEnter(event) {
      if (event.key === 'Enter') {
        enviarMensagem();
      }
    }
  </script>

</body>
</html>
