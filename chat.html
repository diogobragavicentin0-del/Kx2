<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaKx2</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) no-repeat;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .card-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 320px; text-align: center;
        }
        .card-box h2 { margin-bottom: 20px; color: #333; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none;
        }
        .btn-acao {
            width: 100%; padding: 12px; background-color: #007bff; color: white;
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .chat-container {
            width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.95); 
            border-radius: 12px; display: flex; flex-direction: column; height: 85vh; overflow: hidden; 
        }
        .chat-header {
            background-color: #007bff; color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-header button {
            background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        }
        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #f0f2f5; 
        }
        .message {
            background: white; padding: 10px 14px; border-radius: 12px; max-width: 75%; word-wrap: break-word; align-self: flex-start;
        }
        .message.minha-mensagem { align-self: flex-end; background-color: #007bff; color: white; }
        .message strong { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
        .message-time { font-size: 10px; opacity: 0.7; float: right; margin-top: 6px; margin-left: 8px; }
        .chat-input { display: flex; padding: 12px; border-top: 1px solid #ddd; background: white; }
        .chat-input input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-input button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 20px; margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- ETAPA 1: DIGITAR E-MAIL E SENHA -->
    <div class="card-box" id="telaAuth">
        <h2>Entrar no ConectaKx2</h2>
        <form id="formAuth">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-acao">Próximo</button>
        </form>
    </div>

    <!-- ETAPA 2: ESCOLHER NOME DE USUÁRIO -->
    <div class="card-box" id="telaPerfil" style="display: none;">
        <h2>Seu Perfil</h2>
        <form id="formPerfil">
            <div class="input-group">
                <label for="nomeUsuario">Escolha seu nome no chat:</label>
                <input type="text" id="nomeUsuario" placeholder="Ex: Diogo123" required autocomplete="off">
            </div>
            <button type="submit" class="btn-acao">Entrar no Chat</button>
        </form>
    </div>

    <!-- ETAPA 3: SALA DE CHAT -->
    <div class="chat-container" id="telaChat" style="display: none;">
        <div class="chat-header">
            <h3 id="tituloChat">💬 Bate-papo</h3>
            <button onclick="sair()">Sair</button>
        </div>
        <div class="chat-messages" id="mensagensContainer"></div>
        <form class="chat-input" id="formChat">
            <input type="text" id="inputMensagem" placeholder="Digite sua mensagem..." required autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        let usuarioEmailLogado = "";
        let usuarioNomeChat = "";

        document.getElementById('formAuth').addEventListener('submit', function(e) {
            e.preventDefault();
            usuarioEmailLogado = document.getElementById('email').value.trim();
            document.getElementById('telaAuth').style.display = "none";
            document.getElementById('telaPerfil').style.display = "block";
        });

        document.getElementById('formPerfil').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nomeUsuario').value.trim();
            if (nome !== "") {
                usuarioNomeChat = nome;
                document.getElementById('telaPerfil').style.display = "none";
                document.getElementById('telaChat').style.display = "flex";
                document.getElementById('tituloChat').textContent = `💬 Olá, ${usuarioNomeChat}!`;
            }
        });

        const formChat = document.getElementById('formChat');
        const inputMensagem = document.getElementById('inputMensagem');
        const mensagensContainer = document.getElementById('mensagensContainer');

        function adicionarMensagem(autor, texto) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            if (autor === usuarioNomeChat) msgDiv.classList.add('minha-mensagem');

            const agora = new Date();
            const hora = agora.getHours().toString().padStart(2, '0');
            const minuto = agora.getMinutes().toString().padStart(2, '0');

            msgDiv.innerHTML = `<strong>${autor}</strong><span>${texto}</span><span class="message-time">${hora}:${minuto}</span>`;
            mensagensContainer.appendChild(msgDiv);
            mensagensContainer.scrollTop = mensagensContainer.scrollHeight;
        }

        formChat.addEventListener('submit', function(e) {
            e.preventDefault();
            const texto = inputMensagem.value.trim();
            if (texto !== "") {
                adicionarMensagem(usuarioNomeChat, texto);
                inputMensagem.value = "";
            }
        });

        function sair() { location.reload(); }
    </script>
</body>
</html>
