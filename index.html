<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-size: cover;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        .login-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Entrar</h2>
        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const emailDigitado = document.getElementById('email').value;
            const senhaDigitada = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');

            const emailCorreto = "admin@email.com";
            const senhaCorreta = "123456";

            if (emailDigitado === emailCorreto && senhaDigitada === senhaCorreta) {
                mensagem.style.color = "green";
                mensagem.textContent = "Login efetuado com sucesso! Redirecionando...";
                
                localStorage.setItem("usuarioLogado", emailDigitado);

                setTimeout(function() {
                    window.location.href = "chat.html";
                }, 1500);
            } else {
                mensagem.style.color = "red";
                mensagem.textContent = "E-mail ou senha incorretos!";
            }
        });
    </script>

</body>
</html>
